  - description: "The API contains dimension-generic oriented affine hyperplanes with a stored point and unit normal, neutral positive and negative sides whose side-normal vectors have signed normal component equal to the corresponding side sign, open and closed half-spaces, signed normal coordinates, exact normal--tangential vector decomposition and carrier parameterization, the normal component as a real-linear map, its kernel as the tangent submodule, a linear retraction onto that submodule, the exact normal-vector form of any real vector pairing to zero with every tangent vector, and a basis-free characterization of equal tangential projections by equality of all tangent pairings. The geometric sides and tangent data carry no material, wave-role, outgoing, or power meaning."
    done: true
    location: "Physlib/SpaceAndTime/Space/OrientedAffineHyperplane.lean (Space.OrientedAffineHyperplane, Space.OrientedAffineHyperplane.Side, Space.OrientedAffineHyperplane.normalVector, Space.OrientedAffineHyperplane.signedNormalCoordinate, Space.OrientedAffineHyperplane.carrier, Space.OrientedAffineHyperplane.openHalfSpace, Space.OrientedAffineHyperplane.closedHalfSpace, Space.OrientedAffineHyperplane.sideNormalVector, Space.OrientedAffineHyperplane.sideNormalDirection, Space.OrientedAffineHyperplane.normalComponent_sideNormalVector, Space.OrientedAffineHyperplane.normalComponent, Space.OrientedAffineHyperplane.normalComponentLinearMap, Space.OrientedAffineHyperplane.tangentialProjection, Space.OrientedAffineHyperplane.IsTangent, Space.OrientedAffineHyperplane.tangentSubmodule, Space.OrientedAffineHyperplane.projectionToTangent, Space.OrientedAffineHyperplane.signedNormalCoordinate_vadd, Space.OrientedAffineHyperplane.carrier_eq_closedHalfSpace_inter, Space.OrientedAffineHyperplane.signedNormalCoordinate_sideRay, Space.OrientedAffineHyperplane.normalComponent_tangentialProjection, Space.OrientedAffineHyperplane.tangentialProjection_add_normal, Space.OrientedAffineHyperplane.tangentialProjection_normalVector, Space.OrientedAffineHyperplane.projectionToTangent_coe, Space.OrientedAffineHyperplane.eq_normalComponent_smul_normalVector_of_inner_eq_zero_on_tangent, Space.OrientedAffineHyperplane.tangentialProjection_eq_iff_inner_eq_on_tangent, Space.OrientedAffineHyperplane.exists_tangent_vadd_eq_of_mem_carrier)"

  - description: "Oriented affine hyperplanes carry an explicit opposite-side operation, a total side-relative unoriented Euclidean angle, and real vector reflection across the tangent plane. The angle gives pi/2 at the zero vector; its cosine and sine multiplication identities recover respectively the signed normal component and tangential-projection norm. Strict positivity against the selected side normal is exactly the condition that the angle is below pi/2. Reflection commutes with real scalar multiplication, preserves tangential projection and norm, negates the normal component, is involutive, exchanges side normals, and preserves the angle after exchanging reference sides. This neutral geometry assigns no material, wave label, ray, group velocity, energy flux, outgoing condition, observable, irradiance, or power meaning."
    done: true
    location: "Physlib/SpaceAndTime/Space/OrientedAffineHyperplane.lean (Space.OrientedAffineHyperplane.Side.opposite, Space.OrientedAffineHyperplane.Side.opposite_negative, Space.OrientedAffineHyperplane.Side.opposite_positive, Space.OrientedAffineHyperplane.Side.opposite_opposite, Space.OrientedAffineHyperplane.Side.sign_opposite, Space.OrientedAffineHyperplane.sideNormalVector_opposite, Space.OrientedAffineHyperplane.norm_tangentialProjection_sq_add_normalComponent_sq, Space.OrientedAffineHyperplane.angleToSide, Space.OrientedAffineHyperplane.angleToSide_lt_pi_div_two_iff, Space.OrientedAffineHyperplane.angleToSide_mem_Ico_of_inner_pos, Space.OrientedAffineHyperplane.cos_angleToSide_mul_norm, Space.OrientedAffineHyperplane.sin_angleToSide_mul_norm, Space.OrientedAffineHyperplane.vectorReflection, Space.OrientedAffineHyperplane.vectorReflection_eq_sub_two_smul_normalVector, Space.OrientedAffineHyperplane.vectorReflection_smul, Space.OrientedAffineHyperplane.normalComponent_vectorReflection, Space.OrientedAffineHyperplane.tangentialProjection_vectorReflection, Space.OrientedAffineHyperplane.vectorReflection_vectorReflection, Space.OrientedAffineHyperplane.vectorReflection_involutive, Space.OrientedAffineHyperplane.norm_vectorReflection, Space.OrientedAffineHyperplane.vectorReflection_sideNormalVector, Space.OrientedAffineHyperplane.angleToSide_vectorReflection)"

