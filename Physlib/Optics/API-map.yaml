  - description: "The API assembles heterogeneous fixed-frequency scattering components from component-owned dependent port families. It derives aggregate physical ports and channels with explicit component tags, canonically reassociates the dependent channel sums, and constructs the global scattering matrix by dependent block-diagonal assembly followed by channel relabeling. Exact entry and amplitude-action laws prove that each component block is retained and different components have no direct pre-wiring coupling. A one-channel plus nonsymmetric two-channel fixture pins all local entries, both cross-component zero directions, and the mixed output `(4 + 3 I, 12 + 16 I, 18 + 26 I)`. The assembly is independent parallel juxtaposition before wiring, not cascade, feedback, termination, absorption, or a passivity/losslessness claim."
