version: v0.1

Title: Optics

Overview: |
    The optics API sits between field-level electromagnetism and system-level optical design.
    It reuses geometry, dimensional quantities, complex linear algebra, Fourier analysis, the wave
    equation, and Maxwell theory rather than duplicating them. It owns reduced monochromatic
    descriptions of light (phasors, polarization states, rays, and finite power-normalized modes),
    optical observables, component laws, and the semantics for composing components into systems.

    Finite-mode photonic circuits use incident and outgoing mode amplitudes with scattering
    matrices as their component interface. Power preservation and passivity are stated directly
    in terms of modal power; lossless square scattering matrices are unitary. Network composition
    is a separate linear-equation layer, so ordinary cascades of one-way transforms are not
    confused with feedback interconnection of multiport scattering matrices. Jones calculus,
    electromagnetic interfaces, ray-transfer systems, diffraction, and quantum-optical lifts are
    connected layers sharing these definitions, not competing foundations.

    After the shared mode core, development can proceed in two parallel tracks. The circuit track
    develops typed ports, implicit behaviors, well-posed network elimination, and reusable
    integrated-photonic components. The physical-optics track connects phasors, polarization,
    interfaces, and energy flux to electromagnetism. End-to-end systems then reconnect the two.

    The first implementation milestone prioritizes the electromagnetic-to-phasor bridge, Jones and
    Stokes polarization, polarizers and retarders, planar dielectric interfaces, and their shared
    power statements. The circuit, ray, Fourier, and quantum requirements are longer-term design
    proposals. Before those tracks become upstream implementation PRs, each should be discussed
    with maintainers and split into its own focused API map. This top-level map is therefore a
    domain roadmap, not a claim that every requirement belongs in one PR or one foundational file.

ParentAPIs:
  - "Complex linear algebra (Mathlib/LinearAlgebra)"
  - "Space (Physlib/SpaceAndTime/Space)"
  - "Dimensional quantities (Physlib/Units)"
  - "Wave equation (Physlib/ClassicalMechanics/WaveEquation)"
  - "Electromagnetism (Physlib/Electromagnetism)"

