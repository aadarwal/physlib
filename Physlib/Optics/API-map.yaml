  - description: "The API represents implicit complex-linear optical behavior independently of matrix invertibility, embeds arbitrary complex-linear maps and finite mode transforms as graph behaviors, and composes behaviors by relational identity, series, and independent parallel operations. It also constructs source-neutral feedback-solution relations whose retained state is `incident ⊕ outgoing` and whose return relation receives `outgoing ⊕ external`, without asserting existence, uniqueness, or an inverse. It proves graph injectivity, identity and associativity laws, exact agreement with linear-map composition, matrix cascade in the order `second * first`, and block-diagonal direct sum. A nonsymmetric complex cascade distinguishes the two orders, a singular zero transform remains a valid noninjective graph, a free-output relation proves that not every behavior is a graph, and a rejected branch-incorrect output fixes parallel orientation."
