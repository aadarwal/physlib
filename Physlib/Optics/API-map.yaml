  - description: "The API contains typed optical ports, dependent channels, compatible local connections, proof-carrying one-to-one connection families, heterogeneous component families, and flat netlists. Nominal incident and outgoing wrappers prevent direction collapse; typed mode-fiber equivalences prevent incompatible links; distinct endpoints plus global endpoint injectivity rule out self-wiring, reuse, and wire-level fan-out; and every flat netlist binds its connections to the exact aggregate component boundary. This is structural well-formedness, not the decidable executable compiler planned for N4C."
