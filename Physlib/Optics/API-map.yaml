    done: false
    location: N/A

  - description: "The API shall contain typed optical ports, channels, connections, and netlists whose well-formedness enforces compatible one-to-one channel-end matching and prevents malformed interconnections."
    done: false
    location: N/A

  - description: "The API shall represent implicit linear optical behavior independently of matrix invertibility, embed functional mode transforms as graph behaviors, and compose behaviors in series and parallel."
    done: false
    location: N/A

  - description: "For component law `b = S a`, internal wiring `a = C b + E u`, and external readout through the same selected channels, the API shall derive `(1 - C * S) a = E u` and the external scattering matrix obtained by eliminating the internal amplitudes."
    done: false
    location: N/A

  - description: "The API shall define network well-posedness by unique solvability, equivalently by invertibility of the relevant finite linear operator, without making a contraction bound necessary; it shall prove that interconnection preserves passivity and, under the appropriate hypotheses and conventions, losslessness and reciprocity, and shall recover the Redheffer star product for standard two-component feedback."
    done: false
    location: N/A

