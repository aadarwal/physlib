  - description: "Optics identifies incident-reflected normal Poynting interference for actual ordinary-real propagating Jones waves at the oriented interface's stored point. Exact aligned-frame geometry gives the two cross terms as common negative-side admittance times `(chi_i + chi_r)` times the instantaneous real Jones-coordinate pairing, so opposite signed propagation normals cancel pointwise for arbitrary complex Jones data and independent carrier phases or frequencies; an electrically zero reflected wave cancels under its guarded connector while retaining arbitrary dummy carrier normal and frequency. The normal component of the actual superposed Poynting vector therefore equals the two self terms pointwise and over every common interval, without claiming full-vector additivity. A guarded own-period result requires reflected frequency matching only in the active branch. The core fixed-frequency theorem combines this bridge with the separate-wave Fresnel balance and transmitted frequency matching to prove a named normal-flux equality between the actual superposed negative-side field and the actual transmitted field over the incident period. Its canonical non-normal-incidence wrapper derives the common s axis and active reflected guard from canonical frames, phase matching, material data, and explicit opposite normal-sign selections while preserving zero-field dummy labels. Regressions independently check harmonic ordered normal terms `-36/55` and `36/55`, their surviving purely tangential full-vector sum `(21/55, 0, 0)`, instantaneous ordered normal terms at phases zero and pi/2, the explicit-frame and canonical connected endpoints, exact total normal mean `5304/3025`, and both ordinary and canonical zero-reflected cases with dummy frequency `2` against incident frequency `1`; the canonical zero-field fixture also keeps a zero wave vector and a plane-normal dummy frame. The result remains local to one stored plane point and does not claim tangential-interference