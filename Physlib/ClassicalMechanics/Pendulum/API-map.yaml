version: v0.1

Title: Configuration space for pendulum

Overview: |
    A pendulum is a mass swinging under gravity on a string or rod; its
    configuration is set by angles and, for a moving support, the support position,
    so its configuration space is naturally a product of circles and lines. This API
    covers the pendulum problems of Landau and Lifshitz, Mechanics, 3rd ed.,
    Chapter 1, Section 5, together with the dynamics of the simple gravity pendulum.

    The sliding pendulum has a defined configuration space. The simple gravity
    pendulum has its configuration space defined as the circle (Mathlib `Circle`)
    with a map into `Space 2`, and its dynamics on the angular chart
    `EuclideanSpace ℝ (Fin 1)` over `Time`: Lagrangian / Newton / Hamilton
    equivalences, energy conservation, and the small-angle (harmonic) limit. The
    coplanar double pendulum's configuration space is declared but not yet defined.
    A manifold structure on the configuration space, trajectories on the circle
    itself, and the link between the linearized and the full equation of motion
    remain open and are recorded below with location N/A.

ParentAPIs:
  - Classical mechanics Lagrangian (Physlib/ClassicalMechanics/Lagrangian)
  - Space (Physlib/SpaceAndTime/Space)

References:
  - Landau & Lifshitz, Mechanics, 3rd Edition, Chapter 1 (The Equations of motion), Section 5 (The Lagrangian for a system of particles).
  - Landau & Lifshitz, Mechanics, 3rd Edition, Chapter 5 (Small oscillations), Section 21 (Free oscillations in one dimension).

Requirements:

  - description: >
      The key data structure, the configuration space of the pendulum, is defined
      (chosen here as generalized coordinates, the support position and the string
      angle for the sliding pendulum).
    done: true
    location: Physlib/ClassicalMechanics/Pendulum/SlidingPendulum.lean (SlidingPendulum.ConfigurationSpace)

  - description: >
      The API contains the configuration space of the simple gravity pendulum as the
      circle, identified with Mathlib `Circle`, with the angular chart.
    done: true
    location: Physlib/ClassicalMechanics/Pendulum/Geometric/Basic.lean (SimplePendulum.ConfigurationSpace, SimplePendulum.ConfigurationSpace.valHomeomorphism, SimplePendulum.ConfigurationSpace.ofAngle)

  - description: The API shall contain the structure of a manifold on the configuration space.
    done: false
    location: N/A

  - description: >
      The API contains a map from the configuration space of the simple pendulum to
      `Space`, giving the position of the bob in real space.
    done: true
    location: Physlib/ClassicalMechanics/Pendulum/Geometric/Basic.lean (SimplePendulum.ConfigurationSpace.toSpace, SimplePendulum.ConfigurationSpace.toSpace_ofAngle)

  - description: The API shall contain the definition of a trajectory based on the configuration space.
    done: false
    location: N/A

  - description: >
      The API contains the input data of the simple gravity pendulum (mass, length,
      gravity) and a trajectory type for the angular chart.
    done: true
    location: Physlib/ClassicalMechanics/Pendulum/SimplePendulum.lean (SimplePendulum, SimplePendulum.Trajectory)

  - description: >
      The API contains the Lagrangian of the simple gravity pendulum and its equation
      of motion as the vanishing of the variational gradient of the action.
    done: true
    location: Physlib/ClassicalMechanics/Pendulum/SimplePendulum.lean (SimplePendulum.lagrangian, SimplePendulum.gradLagrangian, SimplePendulum.EquationOfMotion)

  - description: >
      The API contains the equivalence of the equation of motion with Newton's second
      law, Hamilton's equations, and the two variational principles, together with
      energy conservation.
    done: true
    location: Physlib/ClassicalMechanics/Pendulum/SimplePendulum.lean (SimplePendulum.equationOfMotion_tfae, SimplePendulum.equationOfMotion_iff_newtons_2nd_law, SimplePendulum.energy_conservation_of_equationOfMotion)

  - description: >
      The API contains the small-angle (harmonic) limit of the simple pendulum,
      including Huygens's period and the cosine motion released from rest.
    done: true
    location: Physlib/ClassicalMechanics/Pendulum/SmallAngle.lean (SimplePendulum.LinearizedEquationOfMotion, SimplePendulum.smallAnglePeriod, SimplePendulum.releasedFromRest, SimplePendulum.sin_sub_id_isLittleO)

  - description: >
      The API shall contain the proof that the cosine motion satisfies the linearized
      equation, and the relation between the linearized and the full equation of motion.
    done: false
    location: N/A
